# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: "Web Quality Gatekeeper"
description: "Run Playwright smoke checks, axe accessibility scans, Lighthouse performance audits, and visual regression diffs"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  url:
    description: "URL to audit"
    required: true
  config-path:
    description: "Path to config JSON file"
    required: false
    default: "configs/default.json"
  baseline-dir:
    description: "Directory for visual regression baselines"
    required: false
    default: "baselines"
  policy:
    description: "Built-in policy template name or policy config path"
    required: false
    default: ""
  fail-on-a11y:
    description: "Fail if accessibility violations are found"
    required: false
    default: "true"
  fail-on-perf:
    description: "Fail if performance budgets are exceeded"
    required: false
    default: "true"
  fail-on-visual:
    description: "Fail if visual diffs exceed threshold"
    required: false
    default: "true"
  allow-internal-targets:
    description: "Allow internal/private audit targets in CI or authenticated runs"
    required: false
    default: "false"
  headers:
    description: "Optional newline-delimited headers in Name: Value format"
    required: false
    default: ""
  cookies:
    description: "Optional cookies in name=value format (semicolon or newline delimited)"
    required: false
    default: ""

outputs:
  status:
    description: "Overall audit status: pass or fail"
    value: ${{ steps.audit.outputs.status }}
  summary-path:
    description: "Path to the JSON summary file"
    value: ${{ steps.audit.outputs.summary-path }}
  summary-v2-path:
    description: "Path to the v2 JSON summary file"
    value: ${{ steps.audit.outputs.summary-v2-path }}
  report-path:
    description: "Path to the HTML report file"
    value: ${{ steps.audit.outputs.report-path }}
  action-plan-path:
    description: "Path to the Markdown action plan file"
    value: ${{ steps.audit.outputs.action-plan-path }}
  pr-risk-ledger-path:
    description: "Path to the PR Risk Ledger JSON file"
    value: ${{ steps.audit.outputs.pr-risk-ledger-path }}
  pr-risk-ledger-md-path:
    description: "Path to the PR Risk Ledger Markdown file"
    value: ${{ steps.audit.outputs.pr-risk-ledger-md-path }}
  sensitive-audit:
    description: "Whether auth headers, cookies, internal-target overrides, or sensitive-audit controls were present"
    value: ${{ steps.audit.outputs.sensitive-audit }}
  bundle-complete:
    description: "Whether this invocation produced a complete, verified artifact bundle"
    value: ${{ steps.audit.outputs.bundle-complete }}
  artifact-paths:
    description: "Newline-delimited current-run artifact paths that are safe to upload"
    value: ${{ steps.audit.outputs.artifact-paths }}

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Check Node engine
      working-directory: ${{ github.action_path }}
      shell: bash
      run: npm run engines:check

    - name: Install dependencies
      working-directory: ${{ github.action_path }}
      shell: bash
      run: npm ci --ignore-scripts

    - name: Resolve Chrome path
      working-directory: ${{ github.action_path }}
      shell: bash
      run: node scripts/ci/resolve-chrome-path.mjs

    - name: Install Playwright browsers (Linux)
      if: env.CHROME_PATH == '' && runner.os == 'Linux'
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      run: npx playwright install --with-deps --only-shell chromium

    - name: Install Playwright browsers (macOS/Windows)
      if: env.CHROME_PATH == '' && runner.os != 'Linux'
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      run: npx playwright install --only-shell chromium

    - name: Build
      working-directory: ${{ github.action_path }}
      shell: bash
      run: npm run build

    - name: Run audit
      id: audit
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_CONFIG: ${{ inputs.config-path }}
        INPUT_BASELINE: ${{ inputs.baseline-dir }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_A11Y: ${{ inputs.fail-on-a11y }}
        INPUT_PERF: ${{ inputs.fail-on-perf }}
        INPUT_VISUAL: ${{ inputs.fail-on-visual }}
        INPUT_ALLOW_INTERNAL: ${{ inputs.allow-internal-targets }}
        INPUT_HEADERS: ${{ inputs.headers }}
        INPUT_COOKIES: ${{ inputs.cookies }}
      run: |
        set -euo pipefail

        normalize_shell_path() {
          local candidate="$1"
          if [[ "$candidate" =~ ^[A-Za-z]:[\\/].* ]]; then
            if command -v wslpath >/dev/null 2>&1; then
              local converted
              if converted="$(wslpath -a "$candidate" 2>/dev/null)"; then
                printf '%s\n' "$converted"
                return
              fi
            fi
            if command -v cygpath >/dev/null 2>&1; then
              local converted
              if converted="$(cygpath -u "$candidate" 2>/dev/null)"; then
                printf '%s\n' "$converted"
                return
              fi
            fi

            local drive_letter="${candidate%%:*}"
            local remainder="${candidate#?:}"
            remainder="${remainder//\\//}"
            drive_letter="$(printf '%s' "$drive_letter" | tr '[:upper:]' '[:lower:]')"
            printf '/%s%s\n' "$drive_letter" "$remainder"
            return
          fi
          printf '%s\n' "$candidate"
        }

        normalize_node_path() {
          local candidate="$1"
          if [[ "$candidate" =~ ^[A-Za-z]:[\\/].* ]]; then
            printf '%s\n' "${candidate//\\//}"
            return
          fi
          printf '%s\n' "$candidate"
        }

        NODE_PLATFORM="$(node -p "process.platform")"

        is_absolute_path() {
          local candidate="$1"
          [[ "$candidate" = /* || "$candidate" =~ ^[A-Za-z]:[\\/].* || "$candidate" =~ ^\\\\ ]]
        }

        ACTION_ROOT_SHELL="$(normalize_shell_path "$GITHUB_ACTION_PATH")"
        WORKSPACE_ROOT_SHELL="$(normalize_shell_path "$GITHUB_WORKSPACE")"

        normalize_runtime_path() {
          local candidate="$1"
          if [[ "$NODE_PLATFORM" == "win32" ]]; then
            normalize_node_path "$candidate"
          else
            normalize_shell_path "$candidate"
          fi
        }

        ACTION_ROOT_RUNTIME="$(normalize_runtime_path "$GITHUB_ACTION_PATH")"
        WORKSPACE_ROOT_RUNTIME="$(normalize_runtime_path "$GITHUB_WORKSPACE")"
        if [[ "$NODE_PLATFORM" != "win32" ]]; then
          export GITHUB_ACTION_PATH="$ACTION_ROOT_RUNTIME"
          export GITHUB_WORKSPACE="$WORKSPACE_ROOT_RUNTIME"
        fi
        GITHUB_OUTPUT_PATH="${GITHUB_OUTPUT:-}"
        if [[ -n "$GITHUB_OUTPUT_PATH" ]]; then
          GITHUB_OUTPUT_PATH="$(normalize_shell_path "$GITHUB_OUTPUT_PATH")"
        fi

        resolve_workspace_path_shell() {
          local candidate="$1"
          candidate="$(normalize_shell_path "$candidate")"
          if [[ "$candidate" = /* ]]; then
            printf '%s\n' "$candidate"
          else
            printf '%s\n' "${WORKSPACE_ROOT_SHELL}/${candidate}"
          fi
        }

        resolve_workspace_path_node() {
          local candidate="$1"
          if is_absolute_path "$candidate"; then
            printf '%s\n' "$(normalize_runtime_path "$candidate")"
          else
            printf '%s/%s\n' "${WORKSPACE_ROOT_RUNTIME}" "$candidate"
          fi
        }

        resolve_config_path() {
          local candidate="$1"
          local workspace_candidate_shell
          local workspace_candidate_node
          workspace_candidate_shell="$(resolve_workspace_path_shell "$candidate")"
          workspace_candidate_node="$(resolve_workspace_path_node "$candidate")"
          if [[ -f "$workspace_candidate_shell" ]]; then
            printf '%s\n' "$workspace_candidate_node"
            return
          fi
          if [[ "$candidate" == "configs/default.json" && -f "${ACTION_ROOT_SHELL}/configs/default.json" ]]; then
            printf '%s\n' "${ACTION_ROOT_RUNTIME}/configs/default.json"
            return
          fi
          printf '%s\n' "$workspace_candidate_node"
        }

        resolve_policy_reference() {
          local candidate="$1"
          local trimmed
          trimmed="${candidate#"${candidate%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          if [[ -z "$trimmed" ]]; then
            printf '%s\n' "$trimmed"
            return
          fi

          local by_prefix="$trimmed"
          local had_policy_prefix="false"
          if [[ "$trimmed" == policy:* ]]; then
            had_policy_prefix="true"
            by_prefix="${trimmed#policy:}"
          fi

          case "$by_prefix" in
            marketing|docs|ecommerce|saas)
              # Preserve built-in policy names so runtime can resolve them internally.
              printf '%s\n' "$trimmed"
              ;;
            *)
              if [[ "$had_policy_prefix" == "true" ]]; then
                printf '%s\n' "$(resolve_workspace_path_node "$by_prefix")"
              else
                printf '%s\n' "$(resolve_workspace_path_node "$trimmed")"
              fi
              ;;
          esac
        }

        CONFIG_PATH="$(resolve_config_path "$INPUT_CONFIG")"
        BASELINE_PATH="$(resolve_workspace_path_node "$INPUT_BASELINE")"
        POLICY_REFERENCE="$(resolve_policy_reference "$INPUT_POLICY")"
        OUT_DIR="${WORKSPACE_ROOT_RUNTIME}/artifacts"
        RUN_ID="$(node -e "console.log(require('node:crypto').randomUUID())")"
        export WQG_RUN_ID="$RUN_ID"

        SENSITIVE_AUDIT=false
        has_nonblank_value() {
          local value="${1:-}"
          [[ -n "${value//[[:space:]]/}" ]]
        }
        case "${WQG_SENSITIVE_AUDIT:-}" in
          1|true|TRUE|yes|YES|on|ON) SENSITIVE_AUDIT=true ;;
        esac
        case "${WQG_ALLOW_INTERNAL_TARGETS:-}" in
          1|true|TRUE|yes|YES|on|ON) SENSITIVE_AUDIT=true ;;
        esac
        if [[ "$INPUT_ALLOW_INTERNAL" == "true" ]]; then
          SENSITIVE_AUDIT=true
        fi
        if has_nonblank_value "$INPUT_HEADERS" || has_nonblank_value "$INPUT_COOKIES" || has_nonblank_value "${WQG_AUTH_HEADER:-}" || has_nonblank_value "${WQG_AUTH_HEADERS:-}" || has_nonblank_value "${WQG_AUTH_HEADERS_APPEND:-}" || has_nonblank_value "${WQG_AUTH_COOKIE:-}" || has_nonblank_value "${WQG_AUTH_COOKIES:-}" || has_nonblank_value "${WQG_AUTH_COOKIES_APPEND:-}"; then
          SENSITIVE_AUDIT=true
        fi
        # Keep the output fail-closed until the audit has produced a receipt for
        # this invocation. This prevents a later artifact upload step from
        # treating stale output as safe after a fatal audit failure.
        echo "sensitive-audit=true" >> "$GITHUB_OUTPUT_PATH"
        echo "bundle-complete=false" >> "$GITHUB_OUTPUT_PATH"
        if [[ -n "$INPUT_HEADERS" ]]; then
          export WQG_AUTH_HEADERS_APPEND="$INPUT_HEADERS"
        fi
        if [[ -n "$INPUT_COOKIES" ]]; then
          export WQG_AUTH_COOKIES_APPEND="$INPUT_COOKIES"
        fi

        ARGS=(
          "$INPUT_URL"
          "--config" "$CONFIG_PATH"
          "--baseline-dir" "$BASELINE_PATH"
          "--out" "$OUT_DIR"
        )
        [[ -n "$POLICY_REFERENCE" ]] && ARGS+=("--policy" "$POLICY_REFERENCE")
        [[ "$INPUT_A11Y" != "true" ]] && ARGS+=("--no-fail-on-a11y")
        [[ "$INPUT_PERF" != "true" ]] && ARGS+=("--no-fail-on-perf")
        [[ "$INPUT_VISUAL" != "true" ]] && ARGS+=("--no-fail-on-visual")
        [[ "$INPUT_ALLOW_INTERNAL" == "true" ]] && ARGS+=("--allow-internal-targets")

        set +e
        node "${ACTION_ROOT_RUNTIME}/dist/cli.js" audit "${ARGS[@]}"
        AUDIT_EXIT=$?
        set -e

        if [[ "$AUDIT_EXIT" -ne 0 && "$AUDIT_EXIT" -ne 1 ]]; then
          exit "$AUDIT_EXIT"
        fi

        validate_completed_bundle() {
          node - "$OUT_DIR" "$RUN_ID" <<'NODE'
        const fs = require("node:fs");
        const path = require("node:path");

        const [outDir, runId] = process.argv.slice(2);
        const requiredFiles = [
          "summary.json",
          "summary.v2.json",
          "report.html",
          "action-plan.md",
          "pr-risk-ledger.json",
          "pr-risk-ledger.md"
        ];
        const fail = (message) => {
          process.stderr.write(`Invalid audit output receipt: ${message}\\n`);
          process.exit(1);
        };

        let receipt;
        try {
          receipt = JSON.parse(fs.readFileSync(path.join(outDir, ".wqg-output-manifest.json"), "utf8"));
        } catch (error) {
          fail(`could not read .wqg-output-manifest.json (${error.message})`);
        }
        if (!receipt || typeof receipt !== "object" || Array.isArray(receipt)) {
          fail("receipt must be a JSON object");
        }
        if (receipt.schemaVersion !== 1 || receipt.status !== "complete" || receipt.runId !== runId) {
          fail("receipt is incomplete, unsupported, or belongs to another run");
        }
        if (!Array.isArray(receipt.generatedFiles) || receipt.generatedFiles.some((file) => typeof file !== "string")) {
          fail("receipt generatedFiles must be a list of relative file names");
        }
        const generatedFiles = new Set();
        for (const file of receipt.generatedFiles) {
          if (
            file.length === 0 ||
            file.includes("\0") ||
            file.includes("\\") ||
            /[\r\n]/.test(file) ||
            /[*?\[\]]/.test(file) ||
            path.isAbsolute(file) ||
            path.posix.isAbsolute(file) ||
            path.win32.isAbsolute(file)
          ) {
            fail("receipt contains an unsafe generated file path");
          }
          const segments = file.split("/");
          if (segments.some((segment) => segment.length === 0 || segment === "." || segment === "..")) {
            fail("receipt contains an unsafe generated file path");
          }
          const artifactPath = path.join(outDir, ...segments);
          const relativePath = path.relative(outDir, artifactPath);
          if (relativePath.startsWith("..") || path.isAbsolute(relativePath)) {
            fail("receipt contains a generated file path outside the output directory");
          }
          if (!fs.lstatSync(artifactPath, { throwIfNoEntry: false })?.isFile()) {
            fail(`missing generated file ${file}`);
          }
          if (generatedFiles.has(file)) {
            fail("receipt lists duplicate generated files");
          }
          generatedFiles.add(file);
        }
        for (const file of requiredFiles) {
          if (!generatedFiles.has(file)) {
            fail(`receipt does not include ${file}`);
          }
        }

        let summary;
        try {
          summary = JSON.parse(fs.readFileSync(path.join(outDir, "summary.json"), "utf8"));
        } catch (error) {
          fail(`could not read summary.json (${error.message})`);
        }
        if (summary.overallStatus !== "pass" && summary.overallStatus !== "fail") {
          fail("summary.json has no pass or fail overallStatus");
        }
        const artifactPaths = [...generatedFiles]
          .map((file) => `artifacts/${file}`)
          .sort((left, right) => left.localeCompare(right));
        process.stdout.write(`${summary.overallStatus}\n${artifactPaths.join("\n")}`);
        NODE
        }

        if ! BUNDLE_OUTPUT="$(validate_completed_bundle)"; then
          echo "Audit ended without a completed output receipt for this run." >&2
          exit 2
        fi

        STATUS="${BUNDLE_OUTPUT%%$'\n'*}"
        ARTIFACT_PATHS="${BUNDLE_OUTPUT#*$'\n'}"
        if [[ "$ARTIFACT_PATHS" == "$BUNDLE_OUTPUT" || -z "$ARTIFACT_PATHS" ]]; then
          echo "Audit receipt did not provide uploadable artifact paths." >&2
          exit 2
        fi

        echo "sensitive-audit=$SENSITIVE_AUDIT" >> "$GITHUB_OUTPUT_PATH"
        echo "bundle-complete=true" >> "$GITHUB_OUTPUT_PATH"
        ARTIFACTS_DELIMITER="wqg-artifacts-${RUN_ID}"
        {
          echo "artifact-paths<<${ARTIFACTS_DELIMITER}"
          printf '%s\n' "$ARTIFACT_PATHS"
          echo "$ARTIFACTS_DELIMITER"
        } >> "$GITHUB_OUTPUT_PATH"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT_PATH"
        echo "summary-path=artifacts/summary.json" >> "$GITHUB_OUTPUT_PATH"
        echo "summary-v2-path=artifacts/summary.v2.json" >> "$GITHUB_OUTPUT_PATH"
        echo "report-path=artifacts/report.html" >> "$GITHUB_OUTPUT_PATH"
        echo "action-plan-path=artifacts/action-plan.md" >> "$GITHUB_OUTPUT_PATH"
        echo "pr-risk-ledger-path=artifacts/pr-risk-ledger.json" >> "$GITHUB_OUTPUT_PATH"
        echo "pr-risk-ledger-md-path=artifacts/pr-risk-ledger.md" >> "$GITHUB_OUTPUT_PATH"

        exit "$AUDIT_EXIT"
