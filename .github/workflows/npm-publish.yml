name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to backfill (for example v3.1.6)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.tag.outputs.release_version }}
      npm_dist_tag: ${{ steps.tag.outputs.npm_dist_tag }}
    steps:
      - name: Validate requested tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be a semantic version tag (for example v3.1.6 or v3.1.6-beta.1+build.5)."
            exit 1
          fi
          echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "npm_dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  validate-package:
    runs-on: ubuntu-latest
    needs: validate-input
    outputs:
      release_commit: ${{ steps.release_origin.outputs.commit }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is published from main
        id: release_origin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          RELEASE_COMMIT="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/main"; then
            echo "::error::Release tag '$RELEASE_TAG' must point to a commit reachable from main."
            exit 1
          fi

          if ! RELEASE_DRAFT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')"; then
            echo "::error::Release tag '$RELEASE_TAG' must have an existing GitHub Release."
            exit 1
          fi
          if [ "$RELEASE_DRAFT" != "false" ]; then
            echo "::error::GitHub Release '$RELEASE_TAG' must be published before npm publishing."
            exit 1
          fi
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify publish runtime
        run: |
          node --version
          npm --version
          node scripts/ci/assert-publish-runtime.mjs
          npm run engines:check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Chrome path
        run: node scripts/ci/resolve-chrome-path.mjs

      - name: Install Playwright browsers
        if: env.CHROME_PATH == ''
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify package
        run: |
          npm run validate:full
          npm run contracts:check

      - name: Smoke test packed tarball
        run: npm run smoke:pack

      - name: Enforce requested tag and package version parity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version tag '$EXPECTED_TAG'."
            exit 1
          fi

      - name: Ensure package version is unpublished
        env:
          RELEASE_VERSION: ${{ needs.validate-input.outputs.release_version }}
        run: |
          VIEW_OUTPUT="$(npm view "web-quality-gatekeeper@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org/ 2>&1)" && {
            echo "::error::web-quality-gatekeeper@${RELEASE_VERSION} is already published."
            exit 1
          }
          VIEW_STATUS=$?

          if printf '%s\n' "$VIEW_OUTPUT" | grep -Eq "(E404|404 Not Found|is not in this registry)"; then
            echo "web-quality-gatekeeper@${RELEASE_VERSION} is not published yet."
            exit 0
          fi

          echo "::error::Unable to confirm that web-quality-gatekeeper@${RELEASE_VERSION} is unpublished."
          printf '%s\n' "$VIEW_OUTPUT"
          exit "$VIEW_STATUS"

      - name: Pack publish artifact
        id: pack
        run: |
          npm pack --ignore-scripts --json > pack.json
          TARBALL="$(node -p "JSON.parse(require('node:fs').readFileSync('pack.json', 'utf8'))[0].filename")"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Generate publish evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          npm run release:evidence -- --release-tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --validation-profile npm-publish --out-dir artifacts/release --pack-json pack.json

      - name: Upload publish evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-evidence
          path: |
            artifacts/release/release-provenance.json
            artifacts/release/sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [validate-input, validate-package]
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Configure npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download publish artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: npm-package

      - name: Reverify immutable npm release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate-package.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          CURRENT_RELEASE_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [ "$CURRENT_RELEASE_COMMIT" != "$RELEASE_COMMIT" ]; then
            echo "::error::Release tag '$RELEASE_TAG' changed after package validation."
            exit 1
          fi

          RELEASE_DRAFT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')"
          if [ "$RELEASE_DRAFT" != "false" ]; then
            echo "::error::GitHub Release '$RELEASE_TAG' must remain published before npm publishing."
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        env:
          NPM_DIST_TAG: ${{ needs.validate-input.outputs.npm_dist_tag }}
        run: |
          if [ "$NPM_DIST_TAG" != "latest" ] && [ "$NPM_DIST_TAG" != "next" ]; then
            echo "::error::Unexpected npm dist-tag '$NPM_DIST_TAG'."
            exit 1
          fi
          shopt -s nullglob
          tarballs=(./npm-package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packed npm tarball, found ${#tarballs[@]}."
            exit 1
          fi
          npm publish "${tarballs[0]}" --provenance --access public --tag "$NPM_DIST_TAG"

      - name: Verify npm package visibility
        env:
          RELEASE_VERSION: ${{ needs.validate-input.outputs.release_version }}
        run: |
          PUBLISHED_VERSION="$(npm view "web-quality-gatekeeper@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org/)"
          if [ "$PUBLISHED_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Expected npm registry version $RELEASE_VERSION, got $PUBLISHED_VERSION."
            exit 1
          fi
