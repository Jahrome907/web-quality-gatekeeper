name: NPM Pack Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19", 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Check trusted publishing runtime (Windows)
        if: runner.os == 'Windows' && matrix.node == 24
        run: node scripts/ci/assert-publish-runtime.mjs

      - name: Check Node engine
        run: npm run engines:check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Chrome path
        run: node scripts/ci/resolve-chrome-path.mjs

      - name: Install Playwright browsers (Linux)
        if: env.CHROME_PATH == '' && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright browsers (macOS/Windows)
        if: env.CHROME_PATH == '' && runner.os != 'Linux'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --only-shell chromium

      - name: Run package smoke
        run: npm run smoke:pack
